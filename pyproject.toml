[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pe6201-rag"
version = "1.0.0"
description = "A citation-first RAG assistant for PE6201 course materials"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=6.0,<7", "certifi>=2025.0"]

[project.scripts]
pe6201-rag = "pe6201_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
